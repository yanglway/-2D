<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>财神2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0f1220 0%,#1a1d3a 100%);color:#fff;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.header-left{display:flex;align-items:baseline;gap:12px}
.main-number{font-size:52px;font-weight:900;color:#ff6b35;text-shadow:0 0 25px rgba(255,107,53,.5)}
.main-number.pop{animation:numPop .6s ease}
@keyframes numPop{0%{transform:scale(1)}50%{transform:scale(1.35);color:#f7c948}100%{transform:scale(1)}}
.countdown{font-size:13px;color:#aaa;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:20px}
.header-right{display:flex;align-items:center;gap:10px}
.live-badge{background:rgba(255,107,53,.15);padding:6px 10px;border-radius:50%}
.live-badge span{font-size:18px;color:#ff6b35;font-weight:900}
.bet-info{padding:10px 16px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05)}
.bet-row{display:flex;justify-content:space-between;align-items:center;margin:3px 0}
.bet-label{color:#888;font-size:13px}
.bet-value{font-size:15px;font-weight:600}
.set-value{color:#4cd964}
.val-value{color:#f7c948}
.date-section{display:flex;align-items:center;gap:8px;padding:10px 16px;color:#aaa;font-size:13px}
.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.session-card{background:linear-gradient(145deg,#1e2040,#161830);border-radius:16px;padding:18px 12px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);transition:transform .3s}
.session-card:hover{transform:translateY(-2px)}
.session-time{font-size:13px;color:#888;margin-bottom:8px}
.session-number{font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 15px rgba(255,255,255,.2)}
.session-number.pop{animation:numPop .6s ease}
.session-status{font-size:11px;margin-top:6px;color:#4cd964}
.session-status.waiting{color:#f7c948}
.result-banner{display:none;background:linear-gradient(135deg,#ff6b35,#f7c948);color:#fff;text-align:center;padding:12px 16px;font-size:16px;font-weight:700;border-radius:12px;margin:8px 16px;box-shadow:0 4px 20px rgba(255,107,53,.4)}
.result-banner.show{display:block;animation:bannerIn .5s ease}
@keyframes bannerIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.balance-bar{display:none;justify-content:space-between;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);padding:10px 16px;font-size:14px;border-radius:12px;margin:8px 16px;border:1px solid rgba(255,255,255,.08)}
.balance-bar.show{display:flex}
.balance-bar b{color:#ff6b35;font-size:16px}
.marquee{display:none;background:rgba(255,107,53,.1);border-left:4px solid #ff6b35;padding:8px 14px;margin:6px 16px;border-radius:8px;font-size:13px;color:#f7c948;overflow:hidden;white-space:nowrap}
.marquee.show{display:block}
.marquee span{display:inline-block;animation:scroll 15s linear infinite}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.bet-bar{background:rgba(255,255,255,.03);margin:6px 16px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.05)}
.bet-bar-time{font-size:12px;color:#888}
.bet-bar-line{font-size:13px;color:#ccc;line-height:1.5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(15,18,32,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid rgba(255,255,255,.08);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#666;font-size:11px;cursor:pointer;padding:8px 0;flex:1;transition:color .3s}
.nav-item.active{color:#ff6b35}
.nav-icon{font-size:22px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;justify-content:center;align-items:center;z-index:2000;padding:20px}
.modal-overlay.show{display:flex}
.modal-content{background:linear-gradient(180deg,#1e1e3a,#16162b);border-radius:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);animation:modalIn .3s ease}
@keyframes modalIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.modal-header h3{font-size:17px}
.modal-close{font-size:22px;color:#888;cursor:pointer}
.modal-close:hover{color:#fff}
.modal-body{padding:18px 20px}
.modal-row{margin-bottom:16px}
.modal-row label{display:block;font-size:13px;color:#aaa;margin-bottom:6px}
.modal-row input,.modal-row select{width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:15px;outline:none}
.modal-row input:focus,.modal-row select:focus{border-color:#ff6b35}
.balance-hint{font-size:12px;color:#ff6b35;text-align:right}
.modal-footer{display:flex;gap:10px;padding:0 20px 20px}
.btn-cancel,.btn-confirm{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s}
.btn-cancel{background:rgba(255,255,255,.08);color:#ccc}
.btn-cancel:hover{background:rgba(255,255,255,.12)}
.btn-confirm{background:linear-gradient(135deg,#ff6b35,#f7c948);color:#fff;box-shadow:0 4px 15px rgba(255,107,53,.35)}
.btn-confirm:hover{transform:translateY(-2px)}
.number-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-height:240px;overflow-y:auto;padding:6px;background:rgba(0,0,0,.2);border-radius:10px}
.number-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid transparent}
.number-cell:hover{background:rgba(255,255,255,.1)}
.number-cell.selected{background:linear-gradient(135deg,#ff6b35,#f7c948);color:#fff;transform:scale(1.08);box-shadow:0 0 12px rgba(255,107,53,.5)}
.history-list{max-height:380px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.history-item:last-child{border-bottom:none}
.history-date{font-size:13px;color:#ccc}
.history-session{font-size:11px;color:#888;margin-top:2px}
.history-number{font-size:22px;font-weight:900;color:#ff6b35;background:rgba(255,107,53,.1);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.history-number.won{background:linear-gradient(135deg,#ff6b35,#f7c948);color:#fff;box-shadow:0 0 12px rgba(255,107,53,.4)}
.empty-tip{text-align:center;color:#666;padding:30px;font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ad-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:none;justify-content:center;align-items:center;padding:20px}
.ad-overlay.show{display:flex}
.ad-box{background:linear-gradient(180deg,#1e1e3a,#2a2a4a);border-radius:20px;padding:30px 24px;text-align:center;max-width:340px;border:1px solid rgba(255,107,53,.3);animation:modalIn .4s ease}
.ad-box h3{color:#f7c948;font-size:20px;margin-bottom:12px}
.ad-box p{color:#ccc;font-size:14px;line-height:1.7;margin-bottom:20px}
.ad-box button{background:linear-gradient(135deg,#ff6b35,#f7c948);color:#fff;border:none;padding:12px 30px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
@media(max-width:375px){.main-number{font-size:42px}.session-number{font-size:36px}.number-grid{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="header">
<div class="header-left">
<div class="main-number" id="currentNumber">--</div>
<div class="countdown" id="countdown">--:--:--</div>
</div>
<div class="header-right">
<div class="live-badge"><span>∞</span></div>
</div>
</div>

<!-- 投注信息 -->
<div class="bet-info">
<div class="bet-row"><span class="bet-label">SET:</span><span class="bet-value set-value" id="setValue">--</span></div>
<div class="bet-row"><span class="bet-label">VAL:</span><span class="bet-value val-value" id="valValue">--</span></div>
</div>

<!-- 日期 -->
<div class="date-section">📅 <span id="currentDate">--</span></div>

<!-- 开奖结果横幅 -->
<div class="result-banner" id="resultBanner"></div>

<!-- 跑马灯 -->
<div class="marquee" id="marquee"><span id="marqueeText"></span></div>

<!-- 余额条 -->
<div class="balance-bar" id="balanceBar">
<span>余额: ¥<b id="balanceValue">0</b></span>
<span>总投注: ¥<b id="totalBetValue">0</b></span>
</div>

<!-- 时段卡片 -->
<div class="session-grid">
<div class="session-card" id="card1">
<div class="session-time">12:00 PM</div>
<div class="session-number" id="session1Num">--</div>
<div class="session-status waiting" id="session1Status">⏳ 等待中</div>
</div>
<div class="session-card" id="card2">
<div class="session-time">04:30 PM</div>
<div class="session-number" id="session2Num">--</div>
<div class="session-status waiting" id="session2Status">⏳ 等待中</div>
</div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
<div class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span><span>首页</span></div>
<div class="nav-item" data-tab="bet"><span class="nav-icon">🎯</span><span>投注</span></div>
<div class="nav-item" data-tab="history"><span class="nav-icon">📊</span><span>记录</span></div>
<div class="nav-item" data-tab="me"><span class="nav-icon">👤</span><span>我的</span></div>
</div>

<!-- 投注弹窗 -->
<div class="modal-overlay" id="betModal">
<div class="modal-content">
<div class="modal-header"><h3>投注确认</h3><span class="modal-close" id="closeBet">✕</span></div>
<div class="modal-body">
<div class="modal-row"><label>选择号码</label><div class="number-grid" id="numberGrid"></div></div>
<div class="modal-row"><label>投注金额</label><input type="number" id="betAmount" placeholder="请输入金额" min="1"></div>
<div class="modal-row"><label>选择时段</label>
<select id="betSession">
<option value="12:00 PM">12:00 PM</option>
<option value="04:30 PM">04:30 PM</option>
</select>
</div>
<div class="modal-row balance-hint">余额: ¥<b id="betBalance">0</b></div>
</div>
<div class="modal-footer">
<button class="btn-cancel" id="cancelBet">取消</button>
<button class="btn-confirm" id="confirmBet">确认投注</button>
</div>
</div>
</div>

<!-- 开奖历史弹窗 -->
<div class="modal-overlay" id="historyModal">
<div class="modal-content">
<div class="modal-header"><h3>开奖记录</h3><span class="modal-close" id="closeHistory">✕</span></div>
<div class="modal-body"><div class="history-list" id="historyList"></div></div>
</div>
</div>

<!-- 我的弹窗 -->
<div class="modal-overlay" id="meModal">
<div class="modal-content">
<div class="modal-header"><h3 id="meTitle">登录账号</h3><span class="modal-close" id="closeMe">✕</span></div>
<div class="modal-body">
<div id="loginForm">
<div class="modal-row"><label>用户名</label><input type="text" id="loginUser" placeholder="请输入用户名"></div>
<div class="modal-row"><label>密码</label><input type="password" id="loginPass" placeholder="请输入密码"></div>
<div class="modal-row"><button class="btn-confirm" id="btnLogin">登录</button></div>
<div class="modal-row" style="text-align:center;font-size:13px;color:#888">还没有账号？<a href="#" id="swReg" style="color:#ff6b35">去注册</a></div>
</div>
<div id="regForm" style="display:none">
<div class="modal-row"><label>用户名</label><input type="text" id="regUser" placeholder="请输入用户名"></div>
<div class="modal-row"><label>密码（至少4位）</label><input type="password" id="regPass" placeholder="请输入密码"></div>
<div class="modal-row"><label>确认密码</label><input type="password" id="regPass2" placeholder="再次输入密码"></div>
<div class="modal-row"><button class="btn-confirm" id="btnReg">注册</button></div>
<div class="modal-row" style="text-align:center;font-size:13px;color:#888">已有账号？<a href="#" id="swLogin" style="color:#ff6b35">去登录</a></div>
</div>
<div id="userInfo" style="display:none">
<div class="modal-row"><label>用户名</label><span id="dispName" style="font-size:16px"></span></div>
<div class="modal-row"><label>余额</label><span style="color:#ff6b35;font-size:18px;font-weight:700">¥ <b id="dispBalance">0</b></span></div>
<div class="modal-row"><label>总投注</label><span>¥ <b id="dispTotalBet">0</b></span></div>
<div class="modal-row"><button class="btn-cancel" id="btnLogout">退出登录</button></div>
</div>
</div>
</div>
</div>

<!-- 广告弹窗 -->
<div class="ad-overlay" id="adOverlay">
<div class="ad-box">
<h3 id="adTitle">财神送福</h3>
<p id="adContent">新用户注册即送10000金币！</p>
<button id="adClose">我知道了</button>
</div>
</div>

<script>
const API='https://miantong.pythonanywhere.com/api';
let state={currentNumber:null,countdown:600,selectedNumber:null,sessions:{},history:[],user:null};

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded',()=>{
initGrid();initNav();initModals();initAuth();initDate();
const saved=localStorage.getItem('cs2d_user');
if(saved){try{state.user=JSON.parse(saved);refreshUI()}catch(e){}}
loadData();setInterval(loadData,30000);
setInterval(()=>{state.countdown--;if(state.countdown<0)state.countdown=600;updateCountdown()},1000);
showAds();
});

// ===== 号码网格 =====
function initGrid(){
const g=document.getElementById('numberGrid');
for(let i=0;i<=99;i++){
const c=document.createElement('div');c.className='number-cell';c.textContent=String(i).padStart(2,'0');
c.onclick=()=>{document.querySelectorAll('.number-cell').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');state.selectedNumber=i};
g.appendChild(c);
}}

// ===== 倒计时 =====
function updateCountdown(){
const t=Math.max(0,state.countdown);
const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,apm=h>=12?'PM':'AM',hh=h%12||12;
document.getElementById('countdown').textContent=`${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${apm}`;
}

// ===== 导航 =====
function initNav(){
document.querySelectorAll('.nav-item').forEach(item=>{
item.onclick=()=>{
document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
item.classList.add('active');
const tab=item.dataset.tab;
if(tab==='bet'){if(!state.user){showToast('请先登录');openModal('meModal');return}refreshBetUI();openModal('betModal');}
else if(tab==='history'){loadHistory();openModal('historyModal');}
else if(tab==='me'){showMe();openModal('meModal');}
};
});
}

// ===== 弹窗 =====
function initModals(){
document.getElementById('closeBet').onclick=()=>closeModal('betModal');
document.getElementById('closeHistory').onclick=()=>closeModal('historyModal');
document.getElementById('closeMe').onclick=()=>closeModal('meModal');
document.getElementById('cancelBet').onclick=()=>closeModal('betModal');
document.getElementById('confirmBet').onclick=doBet;
document.getElementById('adClose').onclick=()=>document.getElementById('adOverlay').classList.remove('show');
}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}

// ===== 投注 =====
function refreshBetUI(){
document.getElementById('betBalance').textContent=state.user?state.user.balance:0;
}
async function doBet(){
const amt=parseFloat(document.getElementById('betAmount').value);
const sess=document.getElementById('betSession').value;
if(state.selectedNumber===null&&state.selectedNumber!==0){showToast('请选择号码');return;}
if(!amt||amt<=0){showToast('请输入金额');return;}
if(!state.user){showToast('请先登录');return;}
if(amt>state.user.balance){showToast('余额不足');return;}
try{
const r=await fetch(API+'/bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:state.user.username,number:state.selectedNumber,amount:amt,session:sess,timestamp:new Date().toISOString()})});
const d=await r.json();
if(d.success){showToast(`✅ 投注成功！号码${state.selectedNumber} 金额¥${amt}`);state.user.balance=d.balance;localStorage.setItem('cs2d_user',JSON.stringify(state.user));refreshUI();closeModal('betModal');document.getElementById('betAmount').value='';state.selectedNumber=null;document.querySelectorAll('.number-cell').forEach(x=>x.classList.remove('selected'));}
else{showToast(d.message||'投注失败');}
}catch(e){showToast('❌ 网络错误');}
}

// ===== 数据加载 =====
async function loadData(){
try{
const r=await fetch(API+'/data');const d=await r.json();
if(!d.success)return;
state.currentNumber=d.currentNumber;state.sessions=d.sessions||{};
document.getElementById('currentNumber').textContent=String(d.currentNumber??'--').padStart(2,'0');
const s1=d.sessions?.['12:00 PM'],s2=d.sessions?.['04:30 PM'];
document.getElementById('session1Num').textContent=s1?.number!==undefined?String(s1.number).padStart(2,'0'):'--';
document.getElementById('session2Num').textContent=s2?.number!==undefined?String(s2.number).padStart(2,'0'):'--';
const st1=document.getElementById('session1Status'),st2=document.getElementById('session2Status');
st1.textContent=s1?.status==='closed'?'✅ 已开奖':'⏳ 等待中';st1.className='session-status '+(s1?.status==='closed'?'':'waiting');
st2.textContent=s2?.status==='closed'?'✅ 已开奖':'⏳ 等待中';st2.className='session-status '+(s2?.status==='closed'?'':'waiting');
document.getElementById('setValue').textContent=d.set||'--';
document.getElementById('valValue').textContent=d.val||'--';
}catch(e){console.warn('数据加载失败',e);}
}

// ===== 开奖历史 =====
async function loadHistory(){
try{
const r=await fetch(API+'/history');const d=await r.json();
state.history=d.history||[];
}catch(e){state.history=[];}
renderHistory();
}
function renderHistory(){
const list=document.getElementById('historyList');
if(!state.history.length){list.innerHTML='<div class="empty-tip">暂无开奖记录</div>';return;}
list.innerHTML=state.history.slice(0,20).map(h=>{
const won=h.number===state.currentNumber;
return`<div class="history-item"><div><div class="history-date">${h.date}</div><div class="history-session">${h.session}</div></div><div class="history-number ${won?'won':''}">${String(h.number).padStart(2,'0')}</div></div>`;
}).join('');
}

// ===== 认证 =====
function initAuth(){
document.getElementById('swReg').onclick=e=>{e.preventDefault();document.getElementById('loginForm').style.display='none';document.getElementById('regForm').style.display='block';document.getElementById('meTitle').textContent='注册账号';};
document.getElementById('swLogin').onclick=e=>{e.preventDefault();document.getElementById('loginForm').style.display='block';document.getElementById('regForm').style.display='none';document.getElementById('meTitle').textContent='登录账号';};
document.getElementById('btnLogin').onclick=async()=>{
const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;
if(!u||!p){showToast('请输入用户名和密码');return;}
try{
const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
const d=await r.json();
if(d.success){state.user={username:d.username,balance:d.balance,totalBet:d.totalBet};localStorage.setItem('cs2d_user',JSON.stringify(state.user));showToast('✅ 登录成功');refreshUI();showMe();}
else{showToast(d.message||'登录失败');}
}catch(e){showToast('❌ 网络错误');}
};
document.getElementById('btnReg').onclick=async()=>{
const u=document.getElementById('regUser').value.trim(),p1=document.getElementById('regPass').value,p2=document.getElementById('regPass2').value;
if(!u||!p1){showToast('请输入用户名和密码');return;}
if(p1!==p2){showToast('两次密码不一致');return;}
try{
const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p1})});
const d=await r.json();
if(d.success){state.user={username:u,balance:d.balance,totalBet:0};localStorage.setItem('cs2d_user',JSON.stringify(state.user));showToast(`✅ 注册成功！赠送¥${d.balance}`);refreshUI();showMe();}
else{showToast(d.message||'注册失败');}
}catch(e){showToast('❌ 网络错误');}
};
document.getElementById('btnLogout').onclick=()=>{state.user=null;localStorage.removeItem('cs2d_user');document.getElementById('balanceBar').classList.remove('show');showMe();showToast('已退出登录');};
}

// ===== 我的页面 =====
function showMe(){
if(state.user){
document.getElementById('loginForm').style.display='none';
document.getElementById('regForm').style.display='none';
document.getElementById('userInfo').style.display='block';
document.getElementById('dispName').textContent=state.user.username;
document.getElementById('dispBalance').textContent=state.user.balance;
document.getElementById('dispTotalBet').textContent=state.user.totalBet||0;
document.getElementById('meTitle').textContent='我的账户';
}else{
document.getElementById('loginForm').style.display='block';
document.getElementById('regForm').style.display='none';
document.getElementById('userInfo').style.display='none';
document.getElementById('meTitle').textContent='登录账号';
}}

// ===== UI 刷新 =====
function refreshUI(){
if(state.user){document.getElementById('balanceBar').classList.add('show');document.getElementById('balanceValue').textContent=state.user.balance;document.getElementById('totalBetValue').textContent=state.user.totalBet||0;}
}

// ===== 广告 =====
async function showAds(){
try{
const r=await fetch(API+'/ads');const d=await r.json();
if(d.success){
const popup=d.ads?.popup,marquee=d.ads?.marquee;
if(popup?.enabled&&!sessionStorage.getItem('ad_shown')){
document.getElementById('adTitle').textContent=popup.title||'公告';
document.getElementById('adContent').textContent=popup.content||'';
document.getElementById('adOverlay').classList.add('show');
sessionStorage.setItem('ad_shown','1');
}
if(marquee?.enabled){document.getElementById('marqueeText').textContent=marquee.content||'';document.getElementById('marquee').classList.add('show');}
}
}catch(e){}
}

// ===== 日期 =====
function initDate(){
const n=new Date(),d=String(n.getDate()).padStart(2,'0'),m=String(n.getMonth()+1).padStart(2,'0'),y=n.getFullYear();
document.getElementById('currentDate').textContent=`${d}/${m}/${y}`;
}

// ===== Toast =====
function showToast(msg){
let t=document.querySelector('.toast');
if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}
t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
