<script>
// ===== 全局配置 =====
var API = "https://miantong.pythonanywhere.com/api";

// ✅ 登录态只看 username，余额永远从后端拉
var username = localStorage.getItem("username") || null;
var lastNumber = null;
var selectedNumbers = [];

// ===== 汇率（核心新增）=====
var rateRMB = 7.25;   // USD/CNY
var rateMMK = 2100;  // USD/MMK

// ===== Toast =====
function toast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "info");
  setTimeout(function() { t.className = "toast"; }, 2800);
}

// ===== 工具函数 =====
function formatNum(n) {
  if (n === null || n === undefined || n === "--") return "--";
  var num = parseInt(n);
  if (isNaN(num)) return "--";
  return (num < 10 ? "0" + num : "" + num);
}

function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }
function closeAd() { document.getElementById("adOverlay").classList.remove("show"); }

// ===== ✅ 从后端拉余额 =====
function refreshBalance(cb) {
  if (!username) return;
  fetch(API + "/user/" + encodeURIComponent(username))
    .then(function(r) { return r.json(); })
    .then(function(r) {
      if (!r.success) return;
      document.getElementById("balanceValue").textContent = r.balance;
      document.getElementById("totalBetValue").textContent = r.totalBet || 0;
      var hint = document.getElementById("betBalanceHint");
      if (hint) hint.textContent = r.balance;
      if (cb) cb(r);
    });
}

// ===== 汇率拉取（1秒）=====
function loadRates() {
  fetch("https://api.exchangerate.host/convert?from=USD&to=CNY")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.success && d.result) {
        rateRMB = d.result;
        document.getElementById("setValue").textContent = rateRMB.toFixed(4);
      }
    });

  fetch("https://api.exchangerate.host/convert?from=USD&to=MMK")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.success && d.result) {
        rateMMK = d.result;
        document.getElementById("valValue").textContent = rateMMK.toFixed(2);
      }
    });
}

// ===== 从汇率生成“虚拟号码”（不影响真实开奖）=====
function getRateNumber() {
  // RMB：取小数点后最后一位
  var rmbStr = rateRMB.toFixed(4);
  var rmbLast = rmbStr.charAt(rmbStr.length - 1);

  // MMK：取最后一位
  var mmkStr = Math.floor(rateMMK).toString();
  var mmkLast = mmkStr.charAt(mmkStr.length - 1);

  return rmbLast + mmkLast;
}

// ===== 渲染汇率号码（1秒）=====
function renderRateNumber() {
  var num = getRateNumber();
  var topEl = document.getElementById("currentNumber");
  if (topEl.textContent !== num) {
    topEl.textContent = num;
    topEl.classList.remove("pop");
    void topEl.offsetWidth;
    topEl.classList.add("pop");
  }
}

// ===== 号码多选 =====
function toggleNum(num, cell) {
  if (!username) { toast("请先登录", "err"); showMe(); return; }
  if (selectedNumbers.indexOf(num) >= 0) {
    selectedNumbers = selectedNumbers.filter(function(n) { return n !== num; });
    cell.classList.remove("selected");
  } else {
    selectedNumbers.push(num);
    cell.classList.add("selected");
  }
  renderSelectedTags();
  updateBetSummary();
}

function renderSelectedTags() {
  var box = document.getElementById("selectedTags");
  if (selectedNumbers.length === 0) { box.innerHTML = ""; return; }
  box.innerHTML = selectedNumbers.map(function(n) {
    return '<span class="selected-tag">' + n + ' <span class="x" onclick="removeNum(\'' + n + '\')">&#10005;</span></span>';
  }).join("");
}

function removeNum(num) {
  selectedNumbers = selectedNumbers.filter(function(n) { return n !== num; });
  var cells = document.querySelectorAll(".number-cell");
  for (var i = 0; i < cells.length; i++) {
    if (cells[i].textContent === num) {
      cells[i].classList.remove("selected");
      break;
    }
  }
  renderSelectedTags();
  updateBetSummary();
}

function updateBetSummary() {
  var amt = parseFloat(document.getElementById("betAmount").value) || 0;
  var total = amt * selectedNumbers.length;
  document.getElementById("selectedCount").textContent = selectedNumbers.length;
  document.getElementById("totalCost").textContent = total;
  var hint = document.getElementById("betBalanceHint");
  if (hint && hint.textContent === "0") {
    refreshBalance();
  }
}

// ===== 投注弹窗 =====
function showBetModal() {
  if (!username) { toast("请先登录", "err"); showMe(); return; }
  selectedNumbers = [];
  var cells = document.querySelectorAll(".number-cell");
  for (var i = 0; i < cells.length; i++) { cells[i].classList.remove("selected"); }
  renderSelectedTags();
  updateBetSummary();
  refreshBalance();
  openModal("betModal");
}

// ===== 投注提交 =====
document.getElementById("confirmBet").onclick = function() {
  var amt = parseFloat(document.getElementById("betAmount").value);
  var session = document.getElementById("betSession").value;
  if (selectedNumbers.length === 0) { toast("请选择至少一个号码", "err"); return; }
  if (!amt || amt <= 0) { toast("请输入有效金额", "err"); return; }

  var btn = this;
  btn.disabled = true;
  btn.textContent = "投注中...";

  fetch(API + "/user/" + encodeURIComponent(username))
    .then(function(r) { return r.json(); })
    .then(function(userData) {
      if (!userData.success) { toast("获取用户信息失败", "err"); return Promise.reject(); }
      var totalCost = amt * selectedNumbers.length;
      if (totalCost > userData.balance) { toast("余额不足", "err"); return Promise.reject(); }

      var promises = selectedNumbers.map(function(num) {
        return fetch(API + "/bet", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, number: num, amount: amt, session: session })
        }).then(function(r) { return r.json(); });
      });
      return Promise.all(promises);
    })
    .then(function(results) {
      if (!results) return;
      var ok = results.filter(function(r) { return r.success; }).length;
      var cost = amt * ok;
      toast("✅ 投注成功 " + ok + " 注，共 ¥" + cost, "ok");
      closeModal("betModal");
      refreshBalance();
      if (document.getElementById("mePage").style.display === "block") {
        renderMePage();
      }
    })
    .catch(function() {})
    .finally(function() {
      btn.disabled = false;
      btn.textContent = "确认投注";
    });
};

// ===== 我的页面 =====
function showMe() {
  document.getElementById("homePage").style.display = "none";
  document.getElementById("mePage").style.display = "block";
  document.querySelectorAll(".nav-item").forEach(function(x) { x.classList.remove("active"); });
  document.querySelector('[data-tab="me"]').classList.add("active");

  if (!username) {
    document.getElementById("mePageBody").innerHTML = `
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchAuth('login',this)">登录</div>
        <div class="auth-tab" onclick="switchAuth('register',this)">注册</div>
      </div>
      <div class="auth-form" id="loginForm">
        <input type="text" id="loginUsername" placeholder="用户名">
        <input type="password" id="loginPassword" placeholder="密码">
        <button class="btn-primary" onclick="doLogin()">登录</button>
      </div>
      <div class="auth-form" id="registerForm" style="display:none">
        <input type="text" id="regUsername" placeholder="用户名">
        <input type="password" id="regPassword" placeholder="密码（≥4位）">
        <button class="btn-primary" onclick="doRegister()">注册</button>
      </div>`;
  } else {
    renderMePage();
  }
}

function renderMePage() {
  fetch(API + "/user/" + encodeURIComponent(username))
    .then(function(r) { return r.json(); })
    .then(function(r) {
      if (!r.success) return;
      document.getElementById("mePageBody").innerHTML = `
        <div class="account-info">
          <div class="account-row"><label>用户名</label><span>${r.username}</span></div>
          <div class="account-row"><label>余额</label><span class="hl">¥${r.balance}</span></div>
          <div class="account-row"><label>总投注</label><span>¥${r.totalBet || 0}</span></div>
        </div>
        <div class="section-title">🎯 投注记录</div>
        <div class="bet-list" id="myBetList"></div>
        <div class="report-grid" id="myReport"></div>
        <button class="btn-cancel" style="width:100%;margin-top:24px;padding:15px;border-radius:14px;background:#ff4757;color:#fff;border:none;font-size:16px;font-weight:600;cursor:pointer" onclick="logout()">退出登录</button>`;

      var list = document.getElementById("myBetList");
      if (!r.bets || r.bets.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="es-icon">📄</div><div class="es-text">暂无投注记录</div></div>';
      } else {
        var html = "";
        r.bets.slice().reverse().forEach(function(b) {
          var st = b.status === "won" ? "✅ 中奖 +" + b.payout : b.status === "lost" ? "❌ 未中" : "⏳ 待开奖";
          html += '<div class="bet-item"><div class="bet-info-left"><span class="bet-num">' + formatNum(b.number) + '</span><span class="bet-meta">' + b.session + ' · ' + b.time + '</span></div><div class="bet-info-right"><div class="bet-amount">¥' + b.amount + '</div><div class="bet-status ' + b.status + '">' + st + '</div></div></div>';
        });
        list.innerHTML = html;
      }

      var s = r.stats || {};
      document.getElementById("myReport").innerHTML =
        '<div class="report-card orange"><div class="rc-label">🎲 投注次数</div><div class="rc-value">' + (s.count||0) + '</div></div>' +
        '<div class="report-card gold"><div class="rc-label">💰 投注金额</div><div class="rc-value">¥' + (s.amount||0) + '</div></div>' +
        '<div class="report-card green"><div class="rc-label">🏆 中奖次数</div><div class="rc-value">' + (s.won||0) + '</div></div>' +
        '<div class="report-card ' + ((s.profit||0)>=0?"green":"red") + '"><div class="rc-label">📊 总盈亏</div><div class="rc-value">' + ((s.profit||0)>=0?"+":"") + (s.profit||0) + '</div></div>';
    });
}

function hideMe() {
  document.getElementById("mePage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
  document.querySelectorAll(".nav-item").forEach(function(x) { x.classList.remove("active"); });
  document.querySelector('[data-tab="home"]').classList.add("active");
}

function switchAuth(type, el) {
  document.querySelectorAll(".auth-tab").forEach(function(x) { x.classList.remove("active"); });
  el.classList.add("active");
  document.getElementById("loginForm").style.display = type === "login" ? "block" : "none";
  document.getElementById("registerForm").style.display = type === "register" ? "block" : "none";
}

// ===== 登录/注册 =====
function doLogin() {
  var u = document.getElementById("loginUsername").value;
  var p = document.getElementById("loginPassword").value;
  if (!u || !p) { toast("请输入用户名和密码", "err"); return; }
  fetch(API + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.success) {
      username = d.username;
      localStorage.setItem("username", username);
      localStorage.removeItem("user");
      toast("登录成功", "ok");
      document.getElementById("balanceBar").style.display = "flex";
      refreshBalance();
      renderMePage();
      loadData();
    } else { toast(d.message || "登录失败", "err"); }
  });
}

function doRegister() {
  var u = document.getElementById("regUsername").value;
  var p = document.getElementById("regPassword").value;
  if (!u || !p) { toast("请输入用户名和密码", "err"); return; }
  if (p.length < 4) { toast("密码至少4位", "err"); return; }
  fetch(API + "/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.success) { toast("注册成功，送 ¥10000", "ok"); doLoginAfterRegister(u, p); }
    else { toast(d.message || "注册失败", "err"); }
  });
}

function doLoginAfterRegister(u, p) {
  fetch(API + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.success) {
      username = d.username;
      localStorage.setItem("username", username);
      localStorage.removeItem("user");
      document.getElementById("balanceBar").style.display = "flex";
      refreshBalance();
      renderMePage();
      loadData();
    }
  });
}

function logout() {
  username = null;
  localStorage.removeItem("username");
  localStorage.removeItem("user");
  toast("已退出登录", "info");
  showMe();
}

// ===== 数据加载 =====
function loadData() {
  fetch(API + "/data").then(function(r) { return r.json(); }).then(function(r) {
    if (!r.success) return;

    // SET / VAL 文案修改（不改 HTML）
    document.querySelector(".bet-label").textContent = "RMB:";
    document.querySelectorAll(".bet-label")[1].textContent = "MMK:";

    // 场次信息
    var s1 = (r.sessions && r.sessions["12:00 PM"]) || {};
    var s2 = (r.sessions && r.sessions["04:30 PM"]) || {};
    document.getElementById("s1Num").textContent = formatNum(s1.number);
    document.getElementById("s2Num").textContent = formatNum(s2.number);
    var el1 = document.getElementById("s1Num");
    var el2 = document.getElementById("s2Num");
    if (s1.number !== "--" && s1.number !== null) el1.classList.add("drawn"); else el1.classList.remove("drawn");
    if (s2.number !== "--" && s2.number !== null) el2.classList.add("drawn"); else el2.classList.remove("drawn");
    document.getElementById("s1Status").textContent = s1.status === "closed" ? "✅ 已开奖" : "⏳ 等待中";
    document.getElementById("s2Status").textContent = s2.status === "closed" ? "✅ 已开奖" : "⏳ 等待中";

    if (username) {
      document.getElementById("balanceBar").style.display = "flex";
      refreshBalance();
    }

    if (r.ads && r.ads.marquee && r.ads.marquee.enabled) {
      document.getElementById("marquee").classList.add("show");
      document.getElementById("marqueeText").textContent = r.ads.marquee.content;
    }
  });
}

function showResult(num, session) {
  var banner = document.getElementById("resultBanner");
  document.getElementById("resultText").textContent = "🎉 " + session + " 开奖号码: " + formatNum(num);
  banner.classList.remove("show");
  void banner.offsetWidth;
  banner.classList.add("show");
  setTimeout(function() { banner.classList.remove("show"); }, 5000);
  toast("🎉 开奖: " + formatNum(num), "ok");
}

function loadHistory() {
  fetch(API + "/history").then(function(r) { return r.json(); }).then(function(r) {
    var list = document.getElementById("historyList");
    if (!r.history || r.history.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="es-icon">📄</div><div class="es-text">暂无记录</div></div>';
      return;
    }
    var html = "";
    r.history.forEach(function(h) {
      html += '<div class="history-item"><div><div class="history-date">' + h.date + '</div><div class="history-session">' + h.session + '</div></div><div class="history-number">' + formatNum(h.number + '</div></div>';
    });
    list.innerHTML = html;
  });
}

// ===== 导航 =====
document.querySelectorAll(".nav-item").forEach(function(item) {
  item.onclick = function() {
    var tab = this.getAttribute("data-tab");
    if (tab === "bet") { showBetModal(); }
    else if (tab === "history") { loadHistory(); openModal("historyModal"); }
    else if (tab === "me") { showMe(); }
    else {
      document.getElementById("mePage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
      document.querySelectorAll(".nav-item").forEach(function(x) { x.classList.remove("active"); });
      this.classList.add("active");
    }
  };
});

// ===== 启动 =====
loadRates();
renderRateNumber();
setInterval(loadRates, 1000);
setInterval(renderRateNumber, 1000);

loadData();
setInterval(loadData, 3000);

if (username) {
  document.getElementById("balanceBar").style.display = "flex";
  refreshBalance();
}

setInterval(function() {
  if (username) refreshBalance();
}, 5000);
</script>
