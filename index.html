<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>财神2D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
  color: #fff;
  min-height: 100vh;
  padding-bottom: 90px;
  overflow-x: hidden;
}

/* ===== 顶部 ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: sticky;
  top: 0;
  z-index: 100;
}
.main-number {
  font-size: 56px;
  font-weight: 900;
  color: #ff6b35;
  text-shadow: 0 0 40px rgba(255,107,53,0.5);
  letter-spacing: 3px;
}
.countdown { font-size: 13px; color: #aaa; background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 20px; }
.balance-bar {
  display: none;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 12px 20px;
  font-size: 14px;
  border-radius: 12px;
  margin: 10px 20px;
  border: 1px solid rgba(255,255,255,0.08);
}
.balance-bar b { color: #ff6b35; font-size: 16px; }

/* ===== 场次 ===== */
.session-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px 20px; }
.session-card {
  background: linear-gradient(145deg, #1e1e3a, #16162b);
  border-radius: 18px;
  padding: 24px 16px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.06);
}
.session-number { font-size: 48px; font-weight: 900; color: #fff; }
.session-number.drawn { color: #ff6b35; }
.session-status { font-size: 12px; margin-top: 10px; color: #4cd964; }
.session-status.waiting { color: #f7c948; }

/* ===== 底部导航 ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  background: rgba(15,15,35,0.95);
  backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: #555;
  font-size: 10px;
  cursor: pointer;
  padding: 8px 0;
  flex: 1;
}
.nav-item.active { color: #ff6b35; }
.nav-icon { font-size: 22px; }

/* ===== 投注弹窗 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: linear-gradient(180deg, #1e1e3a, #16162b);
  border-radius: 24px;
  width: 100%;
  max-width: 440px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 25px 70px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.1);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.modal-header h3 { font-size: 18px; }
.modal-close { font-size: 24px; color: #888; cursor: pointer; }
.modal-body { padding: 20px; }
.modal-footer { display: flex; gap: 12px; padding: 0 24px 24px; }
.btn-cancel, .btn-confirm {
  flex: 1; padding: 15px;
  border-radius: 14px; border: none;
  font-size: 16px; font-weight: 600;
  cursor: pointer;
}
.btn-cancel { background: rgba(255,255,255,0.06); color: #ccc; }
.btn-confirm { background: linear-gradient(135deg, #ff6b35, #f7c948); color: #fff; }

/* ===== 号码网格（关键）===== */
.number-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
  max-height: 260px;
  overflow-y: auto;
  padding: 10px;
  background: rgba(0,0,0,0.25);
  border-radius: 14px;
}
.number-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  color: #ccc;
}
.number-cell.selected {
  background: linear-gradient(135deg, #ff6b35, #f7c948);
  color: #fff;
  transform: scale(1.08);
  box-shadow: 0 0 18px rgba(255,107,53,0.5);
}

/* ===== 我的页面 ===== */
.me-page {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
  z-index: 1500;
  padding: 20px;
  overflow-y: auto;
}
.me-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
}
.back-btn { font-size: 24px; cursor: pointer; color: #ccc; }
.me-title { font-size: 20px; font-weight: 600; }
.account-info { background: rgba(255,255,255,0.05); border-radius: 18px; padding: 20px; margin-bottom: 20px; }
.account-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.account-row:last-child { border-bottom: none; }
.account-row label { color: #888; font-size: 14px; }
.account-row span { font-size: 15px; font-weight: 600; }
.account-row span.hl { color: #ff6b35; font-size: 17px; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: #fff;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 14px;
  z-index: 9999;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.ok { background: #2ed573; }
.toast.err { background: #ff4757; }
</style>
</head>
<body>

<!-- ===== 首页 ===== -->
<div id="homePage">
  <div class="header">
    <div class="main-number" id="currentNumber">--</div>
    <div class="countdown" id="countdown">--:--:--</div>
  </div>

  <div class="balance-bar" id="balanceBar">
    <span>余额: ¥<b id="balanceValue">0</b></span>
    <span>总投注: ¥<b id="totalBetValue">0</b></span>
  </div>

  <div class="session-grid">
    <div class="session-card">
      <div class="session-time">12:00 PM</div>
      <div class="session-number" id="s1Num">--</div>
      <div class="session-status waiting" id="s1Status">⏳ 等待中</div>
    </div>
    <div class="session-card">
      <div class="session-time">04:30 PM</div>
      <div class="session-number" id="s2Num">--</div>
      <div class="session-status waiting" id="s2Status">⏳ 等待中</div>
    </div>
  </div>
</div>

<!-- ===== 我的页面 ===== -->
<div class="me-page" id="mePage">
  <div class="me-header">
    <div class="back-btn" onclick="hideMe()">←</div>
    <div class="me-title">我的账户</div>
  </div>
  <div id="meContent"></div>
</div>

<!-- ===== 投注弹窗 ===== */
<div class="modal-overlay" id="betModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🎯 投注（可多选）</h3>
      <span class="modal-close" onclick="closeBet()">✕</span>
    </div>
    <div class="modal-body">
      <!-- 00-99 号码网格 -->
      <div class="number-grid" id="numberGrid"></div>

      <div style="margin-top:18px">
        <label style="color:#999;font-size:13px">每注金额（¥）</label>
        <input id="betAmount" type="number" value="100" min="10" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;margin-top:8px">
      </div>

      <div style="margin-top:14px">
        <label style="color:#999;font-size:13px">选择场次</label>
        <select id="betSession" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;margin-top:8px">
          <option>12:00 PM</option>
          <option>04:30 PM</option>
        </select>
      </div>

      <div id="betSummary" style="margin-top:14px;font-size:13px;color:#ff6b35;text-align:right">
        已选 <b>0</b> 个号码 | 总投注: ¥<b>0</b> | 余额: ¥<b id="betBalance">0</b>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeBet()">取消</button>
      <button class="btn-confirm" id="confirmBetBtn">确认投注</button>
    </div>
  </div>
</div>

<!-- ===== 底部导航 ===== -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span><span>首页</span></div>
  <div class="nav-item" data-tab="bet"><span class="nav-icon">🎯</span><span>投注</span></div>
  <div class="nav-item" data-tab="me"><span class="nav-icon">👤</span><span>我的</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 配置 =====
var API = "https://miantong.pythonanywhere.com/api";
var user = JSON.parse(localStorage.getItem("user") || "null");
var selectedNumbers = [];

// ===== Toast =====
function toast(msg, type){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type||"ok");
  setTimeout(function(){ t.className = "toast"; }, 2500);
}

// ===== 号码网格（核心）=====
function initNumberGrid(){
  var g = document.getElementById("numberGrid");
  for(var i=0; i<=99; i++){
    var num = i < 10 ? "0"+i : ""+i;
    var cell = document.createElement("div");
    cell.className = "number-cell";
    cell.textContent = num;
    cell.onclick = function(){
      var n = this.textContent;
      if(selectedNumbers.includes(n)){
        selectedNumbers = selectedNumbers.filter(x=>x!==n);
        this.classList.remove("selected");
      } else {
        selectedNumbers.push(n);
        this.classList.add("selected");
      }
      updateBetSummary();
    };
    g.appendChild(cell);
  }
}

function updateBetSummary(){
  var amt = parseFloat(document.getElementById("betAmount").value) || 0;
  var total = amt * selectedNumbers.length;
  document.getElementById("betSummary").innerHTML =
    "已选 <b>" + selectedNumbers.length + "</b> 个号码 | 总投注: ¥<b>" + total + "</b> | 余额: ¥<b>" + (user?user.balance:0) + "</b>";
}

// ===== 投注弹窗 =====
function showBet(){
  if(!user){ toast("请先登录", "err"); showMe(); return; }
  selectedNumbers = [];
  document.getElementById("betBalance").textContent = user.balance;
  document.getElementById("betModal").classList.add("show");
  setTimeout(initNumberGrid, 50);
}

function closeBet(){
  document.getElementById("betModal").classList.remove("show");
  document.getElementById("numberGrid").innerHTML = "";
  selectedNumbers = [];
}

document.getElementById("confirmBetBtn").onclick = function(){
  var amt = parseFloat(document.getElementById("betAmount").value);
  var session = document.getElementById("betSession").value;
  if(selectedNumbers.length === 0){ toast("请选择号码", "err"); return; }
  if(!amt || amt <= 0){ toast("请输入有效金额", "err"); return; }
  if(amt * selectedNumbers.length > user.balance){ toast("余额不足", "err"); return; }

  this.disabled = true;
  this.textContent = "投注中...";

  var promises = selectedNumbers.map(function(num){
    return fetch(API+"/bet", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:user.username, number:num, amount:amt, session:session})
    }).then(r=>r.json());
  });

  Promise.all(promises).then(function(results){
    var ok = results.filter(r=>r.success).length;
    user.balance -= amt * ok;
    localStorage.setItem("user", JSON.stringify(user));
    toast("✅ 投注成功 " + ok + " 注", "ok");
    closeBet();
    loadData();
  }).finally(function(){
    document.getElementById("confirmBetBtn").disabled = false;
    document.getElementById("confirmBetBtn").textContent = "确认投注";
  });
};

// ===== 我的页面 =====
function showMe(){
  document.getElementById("homePage").style.display = "none";
  document.getElementById("mePage").style.display = "block";
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  document.querySelector('[data-tab="me"]').classList.add("active");

  if(!user){
    document.getElementById("meContent").innerHTML = `
      <div style="padding:20px">
        <input id="loginUser" placeholder="用户名" style="width:100%;padding:12px;margin-bottom:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff">
        <input id="loginPass" type="password" placeholder="密码" style="width:100%;padding:12px;margin-bottom:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff">
        <button onclick="login()" style="width:100%;padding:14px;background:linear-gradient(135deg,#ff6b35,#f7c948);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600">登录</button>
        <button onclick="register()" style="width:100%;padding:14px;margin-top:12px;background:rgba(255,255,255,0.06);color:#ccc;border:none;border-radius:14px;font-size:16px">注册</button>
      </div>`;
  } else {
    document.getElementById("meContent").innerHTML = `
      <div class="account-info">
        <div class="account-row"><label>用户名</label><span>${user.username}</span></div>
        <div class="account-row"><label>余额</label><span class="hl">¥${user.balance}</span></div>
        <div class="account-row"><label>总投注</label><span>¥${user.totalBet||0}</span></div>
      </div>
      <button onclick="logout()" style="width:100%;padding:14px;margin-top:20px;background:#ff4757;color:#fff;border:none;border-radius:14px;font-size:16px">退出登录</button>`;
  }
}

function hideMe(){
  document.getElementById("mePage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  document.querySelector('[data-tab="home"]').classList.add("active");
}

// ===== 登录/注册 =====
function login(){
  var u = document.getElementById("loginUser").value;
  var p = document.getElementById("loginPass").value;
  fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
  .then(r=>r.json()).then(d=>{
    if(d.success){
      user = d;
      localStorage.setItem("user",JSON.stringify(d));
      toast("登录成功","ok");
      showMe();
      loadData();
    } else toast(d.message,"err");
  });
}

function register(){
  var u = document.getElementById("loginUser").value;
  var p = document.getElementById("loginPass").value;
  fetch(API+"/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
  .then(r=>r.json()).then(d=>{
    if(d.success){ toast("注册成功","ok"); login(); }
    else toast(d.message,"err");
  });
}

function logout(){
  user=null;
  localStorage.removeItem("user");
  toast("已退出","ok");
  showMe();
}

// ===== 数据加载 =====
function loadData(){
  fetch(API+"/data").then(r=>r.json()).then(d=>{
    document.getElementById("currentNumber").textContent = d.currentNumber || "--";
    document.getElementById("s1Num").textContent = d.sessions["12:00 PM"].number || "--";
    document.getElementById("s2Num").textContent = d.sessions["04:30 PM"].number || "--";
    if(user){
      document.getElementById("balanceBar").style.display = "flex";
      document.getElementById("balanceValue").textContent = user.balance;
      document.getElementById("totalBetValue").textContent = user.totalBet || 0;
    }
  });
}

// ===== 导航 =====
document.querySelectorAll(".nav-item").forEach(item=>{
  item.onclick = function(){
    var tab = this.getAttribute("data-tab");
    if(tab === "bet") showBet();
    else if(tab === "me") showMe();
    else {
      document.getElementById("homePage").style.display = "block";
      document.getElementById("mePage").style.display = "none";
      document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
      this.classList.add("active");
    }
  };
});

// ===== 启动 =====
loadData();
setInterval(loadData, 3000);
if(user) document.getElementById("balanceBar").style.display = "flex";
</script>
</body>
</html>
