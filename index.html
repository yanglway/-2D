<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>财神2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#fff;min-height:100vh;padding-bottom:80px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px)}
.main-number{font-size:48px;font-weight:900;color:#ff6b35;text-shadow:0 0 20px rgba(255,107,53,0.6)}
.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.session-card{background:linear-gradient(145deg,#222244,#1a1a33);border-radius:16px;padding:20px 12px;text-align:center}
.session-number{font-size:42px;font-weight:900}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.history-number{font-size:24px;font-weight:900;color:#ff6b35}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(26,26,46,0.95);display:flex;justify-content:space-around;align-items:center}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font-size:11px;cursor:pointer}
.nav-item.active{color:#ff6b35}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-overlay.show{display:flex}
.modal-content{background:#1e1e3a;border-radius:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:30px;z-index:9999;opacity:0;transition:all .3s}
.toast.show{opacity:1}
.report{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.report div{background:rgba(255,255,255,0.05);border-radius:10px;padding:10px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="main-number" id="currentNumber">--</div>
</div>

<div class="session-grid">
  <div class="session-card"><div class="session-number" id="s1Num">--</div></div>
  <div class="session-card"><div class="session-number" id="s2Num">--</div></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" data-tab="home">🏠 首页</div>
  <div class="nav-item" data-tab="history">📊 记录</div>
  <div class="nav-item" id="meBtn">👤 我的</div>
</div>

<div class="modal-overlay" id="historyModal">
  <div class="modal-content">
    <h3>开奖记录</h3>
    <div id="historyList"></div>
  </div>
</div>

<div class="modal-overlay" id="meModal">
  <div class="modal-content">
    <h3>我的账户</h3>
    <div id="meInfo"></div>
    <div id="myBets"></div>
    <div class="report" id="myReport"></div>
    <button onclick="logout()" style="width:100%;margin-top:10px;padding:10px;background:#ff4757;color:#fff;border:none;border-radius:10px">退出登录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = "https://miantong.pythonanywhere.com/api";
var user = JSON.parse(localStorage.getItem("user") || "null");
var lastNumber = null;

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},2500);
}

function formatNum(n){
  if(n===null||n===undefined||n==="--") return "--";
  var num = parseInt(n);
  if(isNaN(num)) return "--";
  return (num<10?"0"+num:""+num);
}

function loadData(){
  fetch(API+"/data").then(function(r){return r.json();}).then(function(r){
    if(!r.success) return;
    document.getElementById("currentNumber").textContent = formatNum(r.currentNumber);
    document.getElementById("s1Num").textContent = formatNum(r.sessions["12:00 PM"].number);
    document.getElementById("s2Num").textContent = formatNum(r.sessions["04:30 PM"].number);
    var num = parseInt(r.currentNumber);
    if(!isNaN(num) && num !== lastNumber){ lastNumber = num; toast("🎉 开奖: "+formatNum(num)); }
  }).catch(function(){});
}

function loadHistory(){
  fetch(API+"/history").then(function(r){return r.json();}).then(function(r){
    var html = "";
    if(!r.history || !r.history.length){ html = "<p style='text-align:center;color:#666'>暂无记录</p>"; }
    else{ r.history.forEach(function(h){ html += '<div class="history-item"><div>'+h.date+' '+h.session+'</div><div class="history-number">'+formatNum(h.number)+'</div></div>'; }); }
    document.getElementById("historyModal").classList.add("show");
    document.getElementById("historyList").innerHTML = html;
  });
}

function loadMe(){
  if(!user){ toast("请先登录"); return; }
  fetch(API+"/user/"+user.username).then(function(r){return r.json();}).then(function(r){
    if(!r.success) return;
    document.getElementById("meModal").classList.add("show");
    document.getElementById("meInfo").innerHTML = "<p>用户名: "+user.username+"</p><p>余额: ¥"+r.balance+"</p><p>总投注: ¥"+r.totalBet+"</p>";
    var html = "<h4>投注记录</h4>";
    if(!r.bets.length){ html += "<p style='color:#666'>暂无投注</p>"; }
    else{
      r.bets.slice().reverse().forEach(function(b){
        var status = b.status==="won"?"✅ 中奖 +"+b.payout:b.status==="lost"?"❌ 未中":"⏳ 待开奖";
        html += '<div class="history-item"><div>'+b.session+'<br><small>'+b.time+'</small></div><div>号码:'+formatNum(b.number)+'<br>'+status+'</div></div>';
      });
    }
    document.getElementById("myBets").innerHTML = html;
    var s = r.stats;
    document.getElementById("myReport").innerHTML =
      "<div>投注次数<br><b>"+s.count+"</b></div>"+
      "<div>投注金额<br><b>¥"+s.amount+"</b></div>"+
      "<div>中奖次数<br><b>"+s.won+"</b></div>"+
      "<div>总盈亏<br><b style='color:"+(s.profit>=0?"#4cd964":"#ff4757")+"'>"+(s.profit>=0?"+":"")+s.profit+"</b></div>";
  });
}

function logout(){ localStorage.removeItem("user"); user=null; location.reload(); }

document.getElementById("meBtn").onclick = loadMe;
document.querySelector('[data-tab="history"]').onclick = loadHistory;
document.querySelectorAll('.modal-overlay').forEach(function(m){ m.onclick = function(e){ if(e.target===m) m.classList.remove("show"); } });

setInterval(loadData, 5000);
loadData();
</script>
</body>
</html>
