<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>财神2D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #0f1220 0%, #1a1d2f 100%);
    color: #fff;
    min-height: 100vh;
    padding-bottom: 80px;
    overflow-x: hidden;
}

/* ===== 顶部 ===== */
.header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 16px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
.main-number {
    font-size: 52px; font-weight: 900;
    color: #ff6b35;
    text-shadow: 0 0 25px rgba(255,107,53,0.5);
    transition: all 0.3s;
}
.main-number.pop { animation: numPop 0.6s ease; }
@keyframes numPop {
    0%{transform:scale(1)} 50%{transform:scale(1.3);color:#f7c948} 100%{transform:scale(1)}
}
.countdown {
    font-size: 13px; color: #aaa;
    background: rgba(255,255,255,0.08);
    padding: 4px 12px; border-radius: 20px;
}

/* ===== 投注信息 ===== */
.bet-info {
    display: flex; justify-content: space-around;
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.bet-info span { font-size: 14px; color: #ccc; }
.bet-info b { color: #ff6b35; }

/* ===== 日期 ===== */
.date-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; color: #888; font-size: 13px;
}

/* ===== 场次卡片 ===== */
.session-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 16px;
}
.session-card {
    background: linear-gradient(145deg, #1e2138, #16182b);
    border-radius: 16px; padding: 20px 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.session-time { font-size: 13px; color: #888; margin-bottom: 8px; }
.session-num {
    font-size: 40px; font-weight: 900; color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.2);
}
.session-status { font-size: 11px; margin-top: 6px; color: #4cd964; }

/* ===== 开奖横幅 ===== */
.result-banner {
    display: none;
    background: linear-gradient(135deg, #ff6b35, #f7c948);
    color: #fff; text-align: center;
    padding: 12px; font-size: 16px; font-weight: 700;
    border-radius: 12px; margin: 0 16px 12px;
    animation: bannerIn 0.5s ease;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
}
@keyframes bannerIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }

/* ===== 余额条 ===== */
.balance-bar {
    display: none;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    margin: 0 16px 12px; padding: 10px 16px;
    border-radius: 12px; font-size: 14px;
    border: 1px solid rgba(255,255,255,0.08);
}
.balance-bar b { color: #ff6b35; font-size: 16px; }

/* ===== 底部导航 ===== */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 68px;
    background: rgba(15,18,32,0.95);
    backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 1000;
}
.nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; color: #555; font-size: 11px;
    cursor: pointer; padding: 8px 0; flex: 1;
}
.nav-item.active { color: #ff6b35; }
.nav-icon { font-size: 22px; }

/* ===== 弹窗 ===== */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center;
    z-index: 2000; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-content {
    background: linear-gradient(180deg, #1e2138, #16182b);
    border-radius: 20px; width: 100%; max-width: 400px;
    max-height: 85vh; overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: modalIn 0.3s ease;
}
@keyframes modalIn { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.modal-header h3 { font-size: 17px; }
.modal-close { font-size: 22px; color: #888; cursor: pointer; }
.modal-body { padding: 20px; }
.modal-row { margin-bottom: 16px; }
.modal-row label { display:block; font-size:13px; color:#aaa; margin-bottom:8px; }
.modal-row input, .modal-row select {
    width: 100%; padding: 12px 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 15px;
    outline: none;
}
.modal-row input:focus, .modal-row select:focus { border-color: #ff6b35; }
.modal-footer { display: flex; gap: 12px; padding: 0 20px 20px; }
.btn {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn-cancel { background: rgba(255,255,255,0.08); color: #ccc; }
.btn-confirm {
    background: linear-gradient(135deg, #ff6b35, #f7c948);
    color: #fff; box-shadow: 0 4px 15px rgba(255,107,53,0.4);
}

/* ===== 号码网格 ===== */
.number-grid {
    display: grid; grid-template-columns: repeat(10, 1fr);
    gap: 5px; max-height: 240px; overflow-y: auto;
    padding: 8px; background: rgba(0,0,0,0.2); border-radius: 12px;
}
.number-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
}
.number-cell:hover { background: rgba(255,255,255,0.1); }
.number-cell.selected {
    background: linear-gradient(135deg, #ff6b35, #f7c948);
    color: #fff; transform: scale(1.1);
    box-shadow: 0 0 12px rgba(255,107,53,0.5);
}

/* ===== 历史列表 ===== */
.history-list { max-height: 400px; overflow-y: auto; }
.history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.history-date { font-size: 14px; color: #ccc; }
.history-session { font-size: 11px; color: #888; margin-top: 2px; }
.history-number {
    font-size: 22px; font-weight: 900; color: #ff6b35;
    background: rgba(255,107,53,0.1);
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}
.history-number.current {
    background: linear-gradient(135deg, #ff6b35, #f7c948);
    color: #fff; box-shadow: 0 0 15px rgba(255,107,53,0.5);
}

/* ===== 登录弹窗 ===== */
.login-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f1220, #2d1b69, #0f1220);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
}
.login-box {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 40px 32px;
    width: 340px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.login-box h2 {
    background: linear-gradient(135deg, #ff6b35, #f7c948);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-size: 26px; margin-bottom: 6px;
}
.login-box p { color: #888; font-size: 13px; margin-bottom: 24px; }
.login-box input {
    width: 100%; padding: 13px 16px; margin-bottom: 12px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 15px;
    outline: none;
}
.login-box input:focus { border-color: #ff6b35; }
.login-box button {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #ff6b35, #f7c948);
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
}
.login-box .switch {
    margin-top: 16px; font-size: 13px; color: #888;
}
.login-box .switch a { color: #ff6b35; text-decoration: none; margin-left: 4px; }
.login-error { color: #ff4757; font-size: 12px; min-height: 16px; margin-top: 4px; }

/* ===== Toast ===== */
.toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 12px 24px; border-radius: 30px;
    font-size: 14px; z-index: 99999;
    opacity: 0; transition: all 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>

<!-- ===== 登录/注册弹窗 ===== -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2 id="authTitle">🏆 财神2D</h2>
        <p id="authSub">登录后开始投注</p>
        <input id="authUser" placeholder="用户名">
        <input id="authPass" type="password" placeholder="密码（至少4位）">
        <div class="login-error" id="authError"></div>
        <button onclick="submitAuth()" id="authBtn">登 录</button>
        <div class="switch">
            <span id="authSwitchText">没有账号？</span>
            <a href="#" id="authSwitch">去注册</a>
        </div>
    </div>
</div>

<!-- ===== 主界面 ===== -->
<div class="header">
    <div>
        <div class="main-number" id="currentNumber">--</div>
        <div class="countdown" id="countdown">--:--:--</div>
    </div>
</div>

<div class="bet-info">
    <span>SET: <b id="setVal">--</b></span>
    <span>VAL: <b id="valVal">--</b></span>
</div>

<div class="date-bar" id="dateBar">--</div>

<!-- 开奖横幅 -->
<div class="result-banner" id="resultBanner"></div>

<!-- 余额条 -->
<div class="balance-bar" id="balanceBar">
    <span>余额: ¥<b id="balanceVal">0</b></span>
    <span>总投注: ¥<b id="totalBetVal">0</b></span>
</div>

<!-- 场次 -->
<div class="session-grid">
    <div class="session-card">
        <div class="session-time">12:00 PM</div>
        <div class="session-num" id="s1Num">--</div>
        <div class="session-status" id="s1Status"></div>
    </div>
    <div class="session-card">
        <div class="session-time">04:30 PM</div>
        <div class="session-num" id="s2Num">--</div>
        <div class="session-status" id="s2Status"></div>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item active" data-tab="home">
        <span class="nav-icon">🏠</span><span>首页</span>
    </div>
    <div class="nav-item" data-tab="bet">
        <span class="nav-icon">🎯</span><span>投注</span>
    </div>
    <div class="nav-item" data-tab="history">
        <span class="nav-icon">📊</span><span>记录</span>
    </div>
    <div class="nav-item" data-tab="me">
        <span class="nav-icon">👤</span><span>我的</span>
    </div>
</div>

<!-- 投注弹窗 -->
<div class="modal-overlay" id="betModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🎯 投注</h3>
            <span class="modal-close" onclick="closeModal('betModal')">✕</span>
        </div>
        <div class="modal-body">
            <div class="modal-row">
                <label>选择号码（0-99）</label>
                <div class="number-grid" id="numberGrid"></div>
            </div>
            <div class="modal-row">
                <label>投注金额</label>
                <input type="number" id="betAmount" placeholder="输入金额" min="1">
            </div>
            <div class="modal-row">
                <label>选择场次</label>
                <select id="betSession">
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="04:30 PM">04:30 PM</option>
                </select>
            </div>
            <div style="text-align:right;font-size:12px;color:#ff6b35">余额: ¥<span id="betBalance">0</span></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal('betModal')">取消</button>
            <button class="btn btn-confirm" onclick="submitBet()">确认投注</button>
        </div>
    </div>
</div>

<!-- 历史弹窗 -->
<div class="modal-overlay" id="historyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 开奖记录</h3>
            <span class="modal-close" onclick="closeModal('historyModal')">✕</span>
        </div>
        <div class="modal-body">
            <div class="history-list" id="historyList"></div>
        </div>
    </div>
</div>

<!-- 我的弹窗 -->
<div class="modal-overlay" id="meModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>👤 我的账户</h3>
            <span class="modal-close" onclick="closeModal('meModal')">✕</span>
        </div>
        <div class="modal-body" id="meBody">
            <!-- 登录后填充 -->
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== 全局配置 =====
const API = "https://miantong.pythonanywhere.com/api";
let token = localStorage.getItem("user_token") || "";
let currentUser = JSON.parse(localStorage.getItem("user_info") || "null");
let selectedNumber = null;
let isLoginMode = true;

// ===== Toast =====
function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

// ===== API 封装 =====
async function api(url, options = {}) {
    const headers = Object.assign({
        "Content-Type": "application/json",
        "Authorization": token ? `Bearer ${token}` : ""
    }, options.headers || {});
    const r = await fetch(API + url, Object.assign({}, options, {headers}));
    return r.json();
}

// ===== 登录/注册切换 =====
document.getElementById("authSwitch").addEventListener("click", e => {
    e.preventDefault();
    isLoginMode = !isLoginMode;
    document.getElementById("authTitle").textContent = isLoginMode ? "🏆 财神2D" : "📝 注册账号";
    document.getElementById("authSub").textContent = isLoginMode ? "登录后开始投注" : "注册即送10000金币";
    document.getElementById("authBtn").textContent = isLoginMode ? "登 录" : "注 册";
    document.getElementById("authSwitchText").textContent = isLoginMode ? "没有账号？" : "已有账号？";
    document.getElementById("authSwitch").textContent = isLoginMode ? "去注册" : "去登录";
    document.getElementById("authError").textContent = "";
});

// ===== 提交登录/注册 =====
async function submitAuth() {
    const u = document.getElementById("authUser").value.trim();
    const p = document.getElementById("authPass").value;
    const err = document.getElementById("authError");
    if (!u || !p) { err.textContent = "请输入用户名和密码"; return; }
    if (!isLoginMode && p.length < 4) { err.textContent = "密码至少4位"; return; }

    const url = isLoginMode ? "/login" : "/register";
    const d = await api(url, {
        method: "POST",
        body: JSON.stringify({username: u, password: p})
    });

    if (d.success) {
        if (isLoginMode) {
            currentUser = {username: d.username, balance: d.balance, totalBet: d.totalBet};
        } else {
            currentUser = {username: u, balance: d.balance || 10000, totalBet: 0};
        }
        localStorage.setItem("user_info", JSON.stringify(currentUser));
        document.getElementById("loginOverlay").style.display = "none";
        refreshUI();
        toast(isLoginMode ? "登录成功！" : "注册成功！赠送 ¥10000");
        loadData();
    } else {
        err.textContent = d.message || "操作失败";
    }
}

// ===== 回车提交 =====
document.getElementById("authPass").addEventListener("keydown", e => { if(e.key==="Enter") submitAuth(); });
document.getElementById("authUser").addEventListener("keydown", e => { if(e.key==="Enter") submitAuth(); });

// ===== 刷新UI =====
function refreshUI() {
    if (!currentUser) return;
    document.getElementById("balanceBar").style.display = "flex";
    document.getElementById("balanceVal").textContent = currentUser.balance;
    document.getElementById("totalBetVal").textContent = currentUser.totalBet || 0;
    document.getElementById("betBalance").textContent = currentUser.balance;
}

// ===== 加载首页数据 =====
async function loadData() {
    const d = await api("/data");
    if (!d.success) return;

    // 当前号码
    const numEl = document.getElementById("currentNumber");
    if (numEl.textContent !== String(d.currentNumber)) {
        numEl.textContent = d.currentNumber;
        numEl.classList.remove("pop");
        void numEl.offsetWidth;
        numEl.classList.add("pop");
    }

    // 场次
    const s1 = d.sessions?.["12:00 PM"];
    const s2 = d.sessions?.["04:30 PM"];
    document.getElementById("s1Num").textContent = s1?.number ?? "--";
    document.getElementById("s2Num").textContent = s2?.number ?? "--";
    document.getElementById("s1Status").textContent = s1?.status === "completed" ? "✅ 已开奖" : "⏳ 等待中";
    document.getElementById("s2Status").textContent = s2?.status === "completed" ? "✅ 已开奖" : "⏳ 等待中";

    // SET/VAL
    document.getElementById("setVal").textContent = d.set || "--";
    document.getElementById("valVal").textContent = d.val || "--";

    // 广告弹窗
    if (d.ads?.popup?.enabled && !sessionStorage.getItem("popup_shown")) {
        toast("📢 " + d.ads.popup.content);
        sessionStorage.setItem("popup_shown", "1");
    }
}

// ===== 日期 =====
(function initDate() {
    const now = new Date();
    const d = now.getDate().toString().padStart(2,"0");
    const m = (now.getMonth()+1).toString().padStart(2,"0");
    const y = now.getFullYear();
    document.getElementById("dateBar").textContent = `📅 ${y}-${m}-${d}`;
})();

// ===== 号码网格 =====
function initGrid() {
    const grid = document.getElementById("numberGrid");
    grid.innerHTML = "";
    for (let i = 0; i <= 99; i++) {
        const cell = document.createElement("div");
        cell.className = "number-cell";
        cell.textContent = i.toString().padStart(2, "0");
        cell.onclick = () => {
            document.querySelectorAll(".number-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedNumber = i;
        };
        grid.appendChild(cell);
    }
}
initGrid();

// ===== 导航 =====
document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        item.classList.add("active");
        const tab = item.dataset.tab;

        if (tab === "bet") {
            if (!currentUser) { toast("请先登录"); return; }
            refreshUI();
            openModal("betModal");
        } else if (tab === "history") {
            loadHistory();
            openModal("historyModal");
        } else if (tab === "me") {
            showMe();
            openModal("meModal");
        }
    });
});

// ===== 投注 =====
async function submitBet() {
    if (selectedNumber === null) { toast("请选择号码"); return; }
    const amount = parseFloat(document.getElementById("betAmount").value);
    const session = document.getElementById("betSession").value;
    if (!amount || amount <= 0) { toast("请输入有效金额"); return; }
    if (amount > currentUser.balance) { toast("余额不足"); return; }

    const d = await api("/bet", {
        method: "POST",
        body: JSON.stringify({
            username: currentUser.username,
            number: selectedNumber,
            amount: amount,
            session: session
        })
    });

    if (d.success) {
        currentUser.balance = d.balance;
        currentUser.totalBet = (currentUser.totalBet || 0) + amount;
        localStorage.setItem("user_info", JSON.stringify(currentUser));
        refreshUI();
        closeModal("betModal");
        document.getElementById("betAmount").value = "";
        selectedNumber = null;
        document.querySelectorAll(".number-cell").forEach(c => c.classList.remove("selected"));
        toast(`✅ 投注成功！号码: ${selectedNumber}`);

        // 开奖横幅
        if (d.number !== undefined) {
            showResult(d.number, session);
        }
    } else {
        toast(d.message || "投注失败");
    }
}

// ===== 开奖横幅 =====
function showResult(number, session) {
    const banner = document.getElementById("resultBanner");
    banner.textContent = `🎉 ${session} 开奖号码: ${String(number).padStart(2,"0")}`;
    banner.style.display = "block";
    setTimeout(() => banner.style.display = "none", 5000);

    // 更新对应卡片
    const isPM = session === "04:30 PM";
    const el = document.getElementById(isPM ? "s2Num" : "s1Num");
    if (el) {
        el.textContent = String(number).padStart(2,"0");
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
    }
}

// ===== 历史记录 =====
async function loadHistory() {
    const d = await api("/data");
    const history = d.history || [];
    const list = document.getElementById("historyList");
    if (!history.length) { list.innerHTML = '<div style="text-align:center;color:#666;padding:30px">暂无记录</div>'; return; }
    const cur = d.currentNumber;
    list.innerHTML = history.map(h => `
        <div class="history-item">
            <div>
                <div class="history-date">${h.date}</div>
                <div class="history-session">${h.session}</div>
            </div>
            <div class="history-number ${h.number == cur ? 'current' : ''}">${String(h.number).padStart(2,"0")}</div>
        </div>
    `).join("");
}

// ===== 我的 =====
function showMe() {
    const body = document.getElementById("meBody");
    if (!currentUser) {
        body.innerHTML = '<p style="color:#888;text-align:center">请先登录</p>';
        return;
    }
    body.innerHTML = `
        <div style="text-align:center;margin-bottom:20px">
            <div style="font-size:48px">👤</div>
            <div style="font-size:18px;margin-top:8px;font-weight:600">${currentUser.username}</div>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
            <span style="color:#888">余额</span>
            <b style="color:#ff6b35">¥${currentUser.balance}</b>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
            <span style="color:#888">总投注</span>
            <b>¥${currentUser.totalBet || 0}</b>
        </div>
        <button onclick="doLogout()" style="width:100%;margin-top:20px;padding:14px;border-radius:12px;border:none;background:rgba(255,255,255,0.08);color:#ccc;font-size:15px;cursor:pointer">退出登录</button>
    `;
}

function doLogout() {
    currentUser = null;
    token = "";
    localStorage.removeItem("user_info");
    localStorage.removeItem("user_token");
    document.getElementById("balanceBar").style.display = "none";
    closeModal("meModal");
    document.getElementById("loginOverlay").style.display = "flex";
    toast("已退出登录");
}

// ===== 弹窗 =====
function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }

// ===== 自动刷新 =====
setInterval(loadData, 15000);

// ===== 初始化 =====
if (currentUser) {
    document.getElementById("loginOverlay").style.display = "none";
    refreshUI();
}
loadData();
</script>
</body>
</html>
