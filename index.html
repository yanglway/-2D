<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>财神2D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    <div class="main-number" id="currentNumber">--</div>
    <div class="countdown" id="countdown">--:--:--</div>
</div>

<div class="bet-info">
    <div>SET: <span id="setVal">--</span></div>
    <div>VAL: <span id="valVal">--</span></div>
</div>

<div class="balance-bar" id="balanceBar" style="display:none">
    余额: ¥<span id="balance">0</span>
</div>

<div class="session-grid">
    <div class="session-card">
        <div>12:00 PM</div>
        <div class="session-number" id="s1">--</div>
    </div>
    <div class="session-card">
        <div>04:30 PM</div>
        <div class="session-number" id="s2">--</div>
    </div>
</div>

<div class="modal-overlay" id="betModal">
    <div class="modal-content">
        <div class="modal-header">投注</div>
        <div class="modal-body">
            <input id="betNumber" placeholder="号码 0-99">
            <input id="betAmount" type="number" placeholder="金额">
            <select id="betSession">
                <option>12:00 PM</option>
                <option>04:30 PM</option>
            </select>
        </div>
        <div class="modal-footer">
            <button id="doBet">确认投注</button>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
