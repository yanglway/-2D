  <div class="modal-content">

        </select>
      </div>

        已选 <b id="selectedCount">0</b> 个号码 | 总投注: ¥<b id="totalCost">0</b> | 余额: ¥<b id="betBalanceHint">0</b>
      </div>

<script>
// ===== 全局配置 =====
var API = "https://miantong.pythonanywhere.com/api"; // ⚠️ 确认用户名
var user = JSON.parse(localStorage.getItem("user") || "null");
var lastNumber = null;
var selectedNumbers = [];

// ===== Toast =====
function toast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show " + (type || "info");
  setTimeout(function() { t.className = "toast"; }, 2800);
}

// ===== 工具函数 =====
function formatNum(n) {
  if (n === null || n === undefined || n === "--") return "--";
  var num = parseInt(n); if (isNaN(num)) return "--";
  return (num < 10 ? "0" + num : "" + num);
}

function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }
function closeAd() { document.getElementById("adOverlay").classList.remove("show"); }

// ===== 投注弹窗：生成 00-99 号码（核心补全）=====
function showBetModal() {
  if (!user) { toast("请先登录", "err"); showMe(); return; }
  selectedNumbers = [];
  var grid = document.getElementById("numberGrid");
  grid.innerHTML = "";
  for (var i = 0; i <= 99; i++) {
    (function(num) {
      var cell = document.createElement("div");
      cell.className = "number-cell";
      cell.textContent = formatNum(num);
      cell.onclick = function() {
        if (selectedNumbers.includes(num)) {
          selectedNumbers = selectedNumbers.filter(function(n) { return n !== num; });
          cell.classList.remove("selected");
        } else {
          selectedNumbers.push(num);
          cell.classList.add("selected");
        }
        updateBetSummary();
      };
    })(i);
  }
  document.getElementById("betBalanceHint").textContent = user.balance;
  updateBetSummary();
  openModal("betModal");
}

function updateBetSummary() {
  var amt = parseFloat(document.getElementById("betAmount").value) || 0;
  var total = amt * selectedNumbers.length;
  document.getElementById("selectedCount").textContent = selectedNumbers.length;
  document.getElementById("totalCost").textContent = total;
}

// ===== 投注提交（多选支持）=====
document.getElementById("confirmBet").onclick = function() {
  var amt = parseFloat(document.getElementById("betAmount").value);
  var session = document.getElementById("betSession").value;
  if (selectedNumbers.length === 0) { toast("请选择号码", "err"); return; }
  if (!amt || amt <= 0) { toast("请输入有效金额", "err"); return; }
  if (amt * selectedNumbers.length > user.balance) { toast("余额不足", "err"); return; }

  var btn = this; btn.disabled = true; btn.textContent = "投注中...";
  var promises = selectedNumbers.map(function(num) {
    return fetch(API + "/bet", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user.username, number: num, amount: amt, session: session })
    }).then(function(r) { return r.json(); });
  });

  Promise.all(promises).then(function(results) {
    var ok = results.filter(function(r) { return r.success; }).length;
    user.balance -= amt * ok;
    user.totalBet = (user.totalBet || 0) + amt * ok;
    localStorage.setItem("user", JSON.stringify(user));
    toast("✅ 投注成功 " + ok + " 注", "ok");
    closeModal("betModal");
    loadData(); // 实时刷新
    if (document.getElementById("mePage").style.display === "block") loadMyBets();
  }).finally(function() {
    btn.disabled = false; btn.textContent = "确认投注";
  });
};

// ===== 我的页面：跳转而非弹窗 =====
function showMe() {
  document.getElementById("homePage").style.display = "none";
  document.getElementById("mePage").style.display = "block";
  document.querySelectorAll(".nav-item").forEach(function(x) { x.classList.remove("active"); });
  document.querySelector('[data-tab="me"]').classList.add("active");

  if (!user) {
    document.getElementById("mePageBody").innerHTML = `
      <div id="loginForm">
        <div class="auth-tabs">
          <div class="auth-tab active" onclick="switchAuth('login')">登录</div>
          <div class="auth-tab" onclick="switchAuth('register')">注册</div>
        </div>
        <div class="modal-row"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名"></div>
        <div class="modal-row"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
        <div class="modal-footer" style="padding:0"><button class="btn-confirm" style="width:100%" onclick="doLogin()">登录</button></div>
      </div>`;
  } else {
    document.getElementById("mePageBody").innerHTML = `
      <div class="account-info">
        <div class="account-row"><label>用户名</label><span>${user.username}</span></div>
        <div class="account-row"><label>余额</label><span class="hl">¥${user.balance}</span></div>
        <div class="account-row"><label>总投注</label><span>¥${user.totalBet || 0}</span></div>
      </div>
      <h4 style="color:#ccc;font-size:14px;margin:16px 0 8px">🎯 投注记录</h4>
      <div class="bet-list" id="myBetList"></div>
      <div class="report-grid" id="myReport"></div>
      <button class="btn-cancel" style="width:100%;background:#ff4757;color:#fff;margin-top:20px" onclick="logout()">退出登录</button>`;
    loadMyBets();
  }
}

function hideMe() {
  document.getElementById("mePage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
  document.querySelectorAll(".nav-item").forEach(function(x) { x.classList.remove("active"); });
  document.querySelector('[data-tab="home"]').classList.add("active");
}

function switchAuth(type) {
  document.getElementById("loginForm").style.display = type === "login" ? "block" : "none";
  document.getElementById("registerForm").style.display = type === "register" ? "block" : "none";
}

function doLogin() {
  var u = document.getElementById("loginUsername").value;
  var p = document.getElementById("loginPassword").value;
  fetch(API + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) })
  .then(function(r) { return r.json(); }).then(function(d) {
    if (d.success) { user = d; localStorage.setItem("user", JSON.stringify(d)); toast("登录成功", "ok"); loadData(); showMe(); }
    else toast(d.message, "err");
  });
}

function logout() { user = null; localStorage.removeItem("user"); toast("已退出", "info"); showMe(); }

// ===== 我的页面：投注记录 & 报表 =====
function loadMyBets() {
  if (!user) return;
  fetch(API + "/user/" + encodeURIComponent(user.username))
  .then(function(r) { return r.json(); }).then(function(r) {
    var list = document.getElementById("myBetList");
    if (!r.bets || r.bets.length === 0) { list.innerHTML = '<div class="empty-state"><div class="es-icon">📄</div><div class="es-text">暂无投注记录</div></div>'; return; }
    var html = "";
    r.bets.slice().reverse().forEach(function(b) {
      var status = b.status === "won" ? "✅ 中奖 +" + b.payout : b.status === "lost" ? "❌ 未中" : "⏳ 待开奖";
      html += `<div class="bet-item"><div class="bet-info-left"><span class="bet-num">${formatNum(b.number)}</span><span class="bet-meta">${b.session} · ${b.time}</span></div><div class="bet-info-right"><div class="bet-amount">¥${b.amount}</div><div class="bet-status ${b.status}">${status}</div></div></div>`;
    });
    list.innerHTML = html;
    var s = r.stats || {};
    document.getElementById("myReport").innerHTML = `
      <div class="report-card orange"><div class="rc-label">🎲 投注次数</div><div class="rc-value">${s.count||0}</div></div>
      <div class="report-card gold"><div class="rc-label">💰 投注金额</div><div class="rc-value">¥${s.amount||0}</div></div>
      <div class="report-card green"><div class="rc-label">🏆 中奖次数</div><div class="rc-value">${s.won||0}</div></div>
      <div class="report-card ${(s.profit||0)>=0?'green':'red'}"><div class="rc-label">📊 总盈亏</div><div class="rc-value">${(s.profit||0)>=0?'+':''}${s.profit||0}</div></div>`;
  });
}

// ===== 数据加载（实时刷新）=====
function loadData() {
  fetch(API + "/data").then(function(r) { return r.json(); }).then(function(r) {
    if (!r.success) return;
    var curNum = r.currentNumber;
    var topEl = document.getElementById("currentNumber");
    topEl.textContent = formatNum(curNum);
    if (curNum !== "--" && curNum !== lastNumber) {
      lastNumber = curNum; topEl.classList.remove("pop"); void topEl.offsetWidth; topEl.classList.add("pop");
      var sess = r.sessions["04:30 PM"].status === "closed" ? "04:30 PM" : "12:00 PM";
      showResult(curNum, sess);
    }
    document.getElementById("setValue").textContent = r.set || "--";
    document.getElementById("valValue").textContent = r.val || "--";
    var s1 = r.sessions["12:00 PM"], s2 = r.sessions["04:30 PM"];
    document.getElementById("s1Num").textContent = formatNum(s1.number);
    document.getElementById("s2Num").textContent = formatNum(s2.number);
    document.getElementById("s1Status").textContent = s1.status === "closed" ? "✅ 已开奖" : "⏳ 等待中";
    document.getElementById("s2Status").textContent = s2.status === "closed" ? "✅ 已开奖" : "⏳ 等待中";
    if (user) {
      document.getElementById("balanceBar").style.display = "flex";
      document.getElementById("balanceValue").textContent = user.balance;
      document.getElementById("totalBetValue").textContent = user.totalBet || 0;
    }
    if (r.ads && r.ads.marquee && r.ads.marquee.enabled) {
      document.getElementById("marquee").classList.add("show");
      document.getElementById("marqueeText").textContent = r.ads.marquee.content;
    }
  });
}

function showResult(num, session) {
  var banner = document.getElementById("resultBanner");
  document.getElementById("resultText").textContent = "🎉 " + session + " 开奖号码: " + formatNum(num);
  banner.classList.remove("show"); void banner.offsetWidth; banner.classList.add("show");
  setTimeout(function() { banner.classList.remove("show"); }, 5000);
  toast("🎉 开奖: " + formatNum(num), "ok");
}

// ===== 历史记录 =====
function loadHistory() {
  fetch(API + "/history").then(function(r) { return r.json(); }).then(function(r) {
    var list = document.getElementById("historyList");
    if (!r.history || r.history.length === 0) { list.innerHTML = '<div class="empty-state"><div class="es-icon">📄</div><div class="es-text">暂无记录</div></div>'; return; }
    var html = "";
    r.history.forEach(function(h) {
      html += `<div class="history-item"><div><div class="history-date">${h.date}</div><div class="history-session">${h.session}</div></div><div class="history-number">${formatNum(h.number)}</div></div>`;
    });
    list.innerHTML = html;
  });
}

// ===== 导航 =====
document.querySelectorAll(".nav-item").forEach(function(item) {
  item.onclick = function() {
    var tab = this.getAttribute("data-tab");
    if (tab === "bet") { showBetModal(); }
    else if (tab === "history") { loadHistory(); openModal("historyModal"); }
    else if (tab === "me") { showMe(); }
    else {
      hideMe();
      document.getElementById("homePage").style.display = "block";
      document.querySelectorAll(".nav-item").forEach(function(x) { x.classList.remove("active"); });
      this.classList.add("active");
    }
  };
});

// ===== 启动 =====
loadData();
setInterval(loadData, 3000); // 3秒实时刷新
if (user) document.getElementById("balanceBar").style.display = "flex";
</script>
</body>
</html>
